# Taskfile.yml — uyuni-docs build system
# Requires: task (https://taskfile.dev), Go (latest), npx antora, asciidoctor-pdf
#
# ── Build options ──────────────────────────────────────────────────────────────
#
#  OPTION A — Local toolchain (Go + Task + Antora + Asciidoctor-PDF installed)
#    task draft:mlm-dsc          MLM HTML — documentation.suse.com branding (all languages)
#    task draft:mlm-webui        MLM HTML — product WebUI branding (all languages)
#    task draft:uyuni-website    Uyuni HTML — website (all languages)
#    task draft:uyuni-webui      Uyuni HTML — product WebUI (all languages)
#    task draft:all              All four HTML output targets (sequential)
#    task pdf:mlm                All MLM PDFs (all books, all languages)
#    task pdf:uyuni              All Uyuni PDFs (all books, all languages)
#    task pdf:all                All PDFs
#    task obs:mlm                OBS packages for MLM
#    task obs:uyuni              OBS packages for Uyuni
#    task publish:dsc            Full MLM publish — HTML + PDFs + zips
#    task publish:uyuni          Full Uyuni publish — HTML + PDFs + zips
#    task publish:webui-mlm      MLM WebUI publish
#    task publish:webui-uyuni    Uyuni WebUI publish
#    task validate:mlm           Antora xref validation — MLM
#    task validate:uyuni         Antora xref validation — Uyuni
#    task stage-content          Stage translated content for build (en fallback + lang overlay)
#    task translations           [DEPRECATED] Use stage-content instead
#    task pot                    [DEPRECATED] po4a template update — no longer used in build
#    task clean                  Remove build/, translations/, .cache/
#
#  OPTION B — Container (only requires Podman or Docker, nothing else to install)
#    task container:build               Build the uyuni-docs-builder image locally (registry.suse.com/bci/nodejs:22)
#    task container:pull                Pull the latest pre-built image from ghcr.io (update local image)
#    task container:check-update        Check whether a newer image is available on ghcr.io
#    task container:shell               Interactive shell with repo mounted
#    task container:draft:mlm-dsc                MLM HTML — documentation.suse.com branding (all languages)
#    task container:draft:mlm-dsc LANGUAGES=en     MLM HTML — English only
#    task container:draft:mlm-webui                MLM HTML — product WebUI branding (all languages)
#    task container:draft:uyuni-website             Uyuni HTML — website (all languages)
#    task container:draft:uyuni-webui               Uyuni HTML — product WebUI (all languages)
#    task container:draft:all                       All four HTML output targets
#    (All draft/publish/pdf container tasks accept LANGUAGES=en or LANGUAGES="en ja" to limit languages)
#    (PDF tasks build books concurrently, one for each core. JOBS=<n> caps this.)
#    task container:pdf:mlm             All MLM PDFs
#    task container:pdf:uyuni           All Uyuni PDFs
#    task container:pdf:all             All PDFs
#    task container:obs:mlm             OBS packages for MLM
#    task container:obs:uyuni           OBS packages for Uyuni
#    task container:publish:dsc         Full MLM publish — HTML + PDFs + zips
#    task container:publish:uyuni       Full Uyuni publish — HTML + PDFs + zips
#    task container:publish:webui-mlm   MLM WebUI publish
#    task container:publish:webui-uyuni Uyuni WebUI publish
#    task container:validate:mlm        Antora xref validation — MLM
#    task container:validate:uyuni      Antora xref validation — Uyuni
#    task container:stage-content       Stage translated content for build
#    task container:translations        [DEPRECATED] Use container:stage-content instead
#    task container:pot                 [DEPRECATED] po4a template update
#    task container:run -- <target>     Run any task (escape hatch)
#

version: '3'

vars:
  DOCBUILD: "{{.ROOT_DIR}}/.bin/docbuild"
  PDF_THEMES_DIR: "{{.ROOT_DIR}}/branding/pdf/themes"
  PDF_FONTS_DIR: "{{.ROOT_DIR}}/branding/pdf/fonts"
  XREF_EXT: "{{.ROOT_DIR}}/.bin/xref-converter.rb"
  # DOC_LANGUAGES is the canonical set and stays fixed. LANGUAGES is the set
  # that each build task iterates, and the one you override on the command
  # line. The 'translations' task is the exception: po4a reads the .po files
  # directly and processes every language. _guard-lang needs the full set even
  # when LANGUAGES is narrow.
  DOC_LANGUAGES: "en ja zh_CN ko"
  # A Taskfile 'vars' entry has a higher precedence than the OS environment.
  # Read the environment here, or 'export LANGUAGES=en' does nothing and the
  # caller gets every language without a message. A command-line 'LANGUAGES='
  # has a higher precedence than this entry and wins. _guard-lang validates the
  # result from all three sources.
  LANGUAGES: '{{default .DOC_LANGUAGES (env "LANGUAGES")}}'
  BOOKS: "installation-and-upgrade client-configuration administration reference retail common-workflows specialized-guides legal"
  CONTAINER_CMD:
    sh: which podman 2>/dev/null || which docker 2>/dev/null || echo "podman"
  # Use uv if it is present.
  PYTHON_CMD:
    sh: which uv >/dev/null 2>&1 && echo "uv run" || echo "python3"
  BUILDER_IMAGE: "ghcr.io/uyuni-project/uyuni-docs-builder:latest"
  # The builder image has no Python.
  PYTHON_IMAGE: "registry.suse.com/bci/python:3.11"

# 'task pdf:mlm JOBS=4' sets a Task variable. Templates can read it, but the
# command shell cannot. build_pdfs.sh reads JOBS from the environment. This
# block exports it to every task.
#
# An unset JOBS becomes an empty string here, not an absent variable. The
# script therefore tests for an empty value and then uses the core count.
env:
  JOBS: '{{.JOBS}}'

tasks:
  # --------------------------------------------------------------------------
  # Default — human-friendly help (runs when you type just: task)
  # --------------------------------------------------------------------------
  default:
    silent: true
    cmds:
      - |
        echo ""
        echo "  uyuni-docs — build tasks"
        echo ""
        echo "  ── CONTAINER  (recommended — requires only Podman or Docker) ───────────────"
        echo "    container:publish:dsc          Full MLM publish — HTML + PDFs + zips"
        echo "    container:publish:uyuni        Full Uyuni publish — HTML + PDFs + zips"
        echo "    container:publish:webui-mlm    MLM WebUI publish — HTML + PDFs + zips"
        echo "    container:publish:webui-uyuni  Uyuni WebUI publish — HTML + PDFs + zips"
        echo "    container:pdf:mlm              All MLM PDFs — all books, all languages"
        echo "    container:pdf:uyuni            All Uyuni PDFs — all books, all languages"
        echo "    container:pdf:all              All PDFs — both products, all languages"
        echo "    container:obs:mlm              OBS source packages for MLM"
        echo "    container:obs:uyuni            OBS source packages for Uyuni"
        echo ""
        echo "  ── DRAFT / PREVIEW  (HTML only — fast local preview without PDFs) ──────────"
        echo "    container:draft:mlm-dsc        MLM HTML — documentation.suse.com branding"
        echo "    container:draft:mlm-webui      MLM HTML — WebUI branding with language selector"
        echo "    container:draft:uyuni-website  Uyuni HTML — website branding"
        echo "    container:draft:uyuni-webui    Uyuni HTML — WebUI branding with language selector"
        echo "    container:draft:all            All four HTML targets (sequential)"
        echo "    draft:mlm-dsc                  (local) MLM HTML — documentation.suse.com branding"
        echo "    draft:mlm-webui                (local) MLM HTML — WebUI branding with language selector"
        echo "    draft:uyuni-website            (local) Uyuni HTML — website branding"
        echo "    draft:uyuni-webui              (local) Uyuni HTML — WebUI branding with language selector"
        echo ""
        echo "  Tip: append LANGUAGES=en (or \"en ja\") to any draft/publish/pdf task to limit languages."
        echo "    Example:  task container:draft:mlm-dsc LANGUAGES=en"
        echo "    Example:  task draft:uyuni-website LANGUAGES=\"en ja\""
        echo "    Example:  task publish:dsc LANGUAGES=en"
        echo "    Every task, including 'task pdf', takes LANGUAGES."
        echo ""
        echo "  Tip: PDF builds run books concurrently, one for each core. JOBS=<n> caps this."
        echo "    Example:  task container:pdf:mlm LANGUAGES=en JOBS=4"
        echo ""
        echo "  ── LOCAL  (Go + Task + Antora + asciidoctor-pdf installed locally) ──────────"
        echo "    publish:dsc              Full MLM publish — HTML (d.s.c branding) + PDFs + zips"
        echo "    publish:uyuni            Full Uyuni publish — HTML (website branding) + PDFs + zips"
        echo "    publish:webui-mlm        MLM WebUI publish — HTML (language selector) + PDFs + zips"
        echo "    publish:webui-uyuni      Uyuni WebUI publish — HTML (language selector) + PDFs + zips"
        echo "    pdf:mlm                  All MLM PDFs — all books, all languages"
        echo "    pdf:uyuni                All Uyuni PDFs — all books, all languages"
        echo "    pdf:all                  All PDFs — both products, all languages"
        echo "    obs:mlm                  OBS source packages for MLM"
        echo "    obs:uyuni                OBS source packages for Uyuni"
        echo "    (All local tasks accept LANGUAGES=en or LANGUAGES=\"en ja\" to limit languages)"
        echo ""
        echo "  ── ONE BOOK PDF ─────────────────────────────────────────────────────────────"
        echo "    task pdf BOOK=<book> PRODUCT=<product> LANGUAGES=<langs>"
        echo ""
        echo "    Books:    installation-and-upgrade  client-configuration  administration"
        echo "              reference  retail  common-workflows  specialized-guides  legal"
        echo "    Products: mlm  uyuni"
        echo "    Languages: en  ja  zh_CN  ko  (all of them unless you narrow it)"
        echo ""
        echo "    Example:  task pdf BOOK=administration PRODUCT=mlm LANGUAGES=en"
        echo "    Example:  task pdf BOOK=installation-and-upgrade PRODUCT=uyuni LANGUAGES=\"en ja\""
        echo ""
        echo "  ── DEV / TOOLING ────────────────────────────────────────────────────────────"
        echo "    setup              Build the Go toolchain binary (.bin/docbuild)"
        echo "    gen                Regenerate site configs and xref-converter extension"
        echo "    clean              Remove build output, translation dirs, and Antora cache"
        echo "    container:build        Build the uyuni-docs-builder container image locally"
        echo "    container:pull         Pull the latest pre-built image from ghcr.io"
        echo "    container:check-update Check whether a newer image is available on ghcr.io"
        echo "    container:shell        Open an interactive shell inside the container"
        echo ""
        echo "  Run 'task --summary <task>' for details  |  'task --list' for the full index"
        echo ""

  # --------------------------------------------------------------------------
  # Guard — LANGUAGES selects the documentation languages.
  #
  # Check 1 matches bare documentation codes only, so an inherited POSIX locale
  # ('en_US.UTF-8', 'C') passes.
  #
  # Checks 2 and 3 make LANGUAGES safe to trust. A 'for: {var: LANGUAGES}' loop
  # over an empty value runs no iterations and exits 0: the build makes no
  # PDFs, reports success, and the pdf-collect, pdf-zip and obs steps then
  # publish an empty tree. An unknown code such as 'jp' has the same result.
  # Every task that iterates LANGUAGES depends on this guard, so one check
  # covers all of them.
  #
  # The checks are 'preconditions', not 'cmds'. Task skips the commands of a
  # dependency under '--dry' but evaluates its preconditions, so only this form
  # catches a bad selection in a dry run. It also keeps the message out of the
  # printed command list.
  #
  # Both values reach the test scripts as environment variables, not as
  # templated text. A check therefore compares a value that holds shell
  # metacharacters and does not execute it. A precondition inherits the task's
  # 'env' block.
  #
  # Task renders 'msg' from the template context and not from the script, so a
  # message cannot name the code that failed. Each message prints the full
  # value.
  # --------------------------------------------------------------------------
  _guard-lang:
    internal: true
    silent: true
    env:
      GUARD_LANG: '{{.LANG}}'
      GUARD_LANGUAGES: '{{.LANGUAGES}}'
    preconditions:
      - sh: |
          for L in {{.DOC_LANGUAGES}} ; do
            if [ "$L" = "${GUARD_LANG:-}" ] ; then
              exit 1
            fi
          done
        msg: |2

            ERROR: LANG={{.LANG}} does not select a documentation language.
                   Use LANGUAGES instead:
                     task <target> LANGUAGES={{.LANG}}

      # Unquoted, so the word split removes the whitespace. An empty result
      # means that LANGUAGES contains only spaces, tabs or newlines.
      - sh: |
          set -- ${GUARD_LANGUAGES:-}
          test $# -gt 0
        msg: |2

            ERROR: LANGUAGES is empty. This build makes no output and
                   reports success.
                     task <target> LANGUAGES="{{.DOC_LANGUAGES}}"

      - sh: |
          for want in ${GUARD_LANGUAGES:-} ; do
            # A flag, not 'break 2'. Under errexit, a failed '[ ] &&' list at
            # the end of a loop body stops the whole check.
            known=0
            for have in {{.DOC_LANGUAGES}} ; do
              if [ "$want" = "$have" ] ; then
                known=1
                break
              fi
            done
            if [ "$known" -eq 0 ] ; then
              exit 1
            fi
          done
        msg: |2

            ERROR: LANGUAGES="{{.LANGUAGES}}" contains a value that is not a
                   documentation language.
                     choose from: {{.DOC_LANGUAGES}}


  # --------------------------------------------------------------------------
  # Setup — build the Go binary
  # --------------------------------------------------------------------------
  setup:
    desc: "[Dev] Build the Go toolchain binary (.bin/docbuild)"
    cmds:
      - mkdir -p .bin
      - go build -buildvcs=false -o {{.DOCBUILD}} ./cmd/docbuild/
    sources:
      - cmd/docbuild/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - .bin/docbuild

  # --------------------------------------------------------------------------
  # Config generation
  # --------------------------------------------------------------------------
  gen:
    desc: "[Dev] Regenerate site configs and xref-converter extension"
    deps: [setup]
    sources:
      - config.yml
      - .bin/docbuild
    generates:
      - .bin/xref-converter.rb
    cmds:
      - "{{.DOCBUILD}} gen-all"

  # --------------------------------------------------------------------------
  # HTML builds
  # --------------------------------------------------------------------------
  draft:mlm-dsc:
    desc: "[Draft] MLM HTML — documentation.suse.com branding (all languages)"
    deps: [setup, _guard-lang]
    cmds:
      - task: stage-content
      - for: {var: LANGUAGES}
        cmd: |
          echo "==> Building mlm-dsc / {{.ITEM}}"
          {{.DOCBUILD}} gen-site -product mlm -output mlm-dsc -lang {{.ITEM}}
          {{.DOCBUILD}} gen-antora -product mlm -lang {{.ITEM}}
          DOCSEARCH_ENABLED=true SITE_SEARCH_PROVIDER=lunr \
            npx antora translations/{{.ITEM}}/mlm-dsc.site.yml --stacktrace

  draft:mlm-webui:
    desc: "[Draft] MLM HTML — WebUI branding with language selector (all languages)"
    deps: [setup, _guard-lang]
    cmds:
      - task: stage-content
      - for: {var: LANGUAGES}
        cmd: |
          echo "==> Building mlm-webui / {{.ITEM}}"
          {{.DOCBUILD}} gen-site -product mlm -output mlm-webui -lang {{.ITEM}}
          {{.DOCBUILD}} gen-antora -product mlm -lang {{.ITEM}}
          cp -a branding/supplemental-ui/mlm/webui-2025/ translations/{{.ITEM}}/supplemental-ui/
          {{.DOCBUILD}} inject-lang-selector -hbs translations/{{.ITEM}}/supplemental-ui/partials/header-content.hbs
          DOCSEARCH_ENABLED=true SITE_SEARCH_PROVIDER=lunr \
            npx antora translations/{{.ITEM}}/mlm-webui.site.yml --stacktrace

  draft:uyuni-website:
    desc: "[Draft] Uyuni HTML — website branding (all languages)"
    deps: [setup, _guard-lang]
    cmds:
      - task: stage-content
      - for: {var: LANGUAGES}
        cmd: |
          echo "==> Building uyuni-website / {{.ITEM}}"
          {{.DOCBUILD}} gen-site -product uyuni -output uyuni-website -lang {{.ITEM}}
          {{.DOCBUILD}} gen-antora -product uyuni -lang {{.ITEM}}
          DOCSEARCH_ENABLED=true SITE_SEARCH_PROVIDER=lunr \
            npx antora translations/{{.ITEM}}/uyuni-website.site.yml --stacktrace

  draft:uyuni-webui:
    desc: "[Draft] Uyuni HTML — WebUI branding with language selector (all languages)"
    deps: [setup, _guard-lang]
    cmds:
      - task: stage-content
      - for: {var: LANGUAGES}
        cmd: |
          echo "==> Building uyuni-webui / {{.ITEM}}"
          {{.DOCBUILD}} gen-site -product uyuni -output uyuni-webui -lang {{.ITEM}}
          {{.DOCBUILD}} gen-antora -product uyuni -lang {{.ITEM}}
          cp -a branding/supplemental-ui/uyuni/uyuni-2023/ translations/{{.ITEM}}/supplemental-ui/
          {{.DOCBUILD}} inject-lang-selector -hbs translations/{{.ITEM}}/supplemental-ui/partials/header-content.hbs
          DOCSEARCH_ENABLED=true SITE_SEARCH_PROVIDER=lunr \
            npx antora translations/{{.ITEM}}/uyuni-webui.site.yml --stacktrace

  draft:all:
    desc: "[Draft] All four HTML output targets (sequential)"
    deps: [_guard-lang]
    cmds:
      - task: draft:mlm-dsc
      - task: draft:mlm-webui
      - task: draft:uyuni-website
      - task: draft:uyuni-webui

  # --------------------------------------------------------------------------
  # PDF staging — the content tree and the entities file for one product and
  # language. Every book of a language shares both, and concurrent writes to
  # them are not safe. Stage each language one time, then build its books with
  # STAGE=0.
  #
  # 'pdf:mlm' and 'pdf:uyuni' call this in their own process, therefore
  # stage-content can dedupe itself with 'run: once'. The single-book 'pdf'
  # task calls it as a subprocess, which is why this task is not internal. It
  # has no 'desc', which keeps it out of 'task --list'.
  # --------------------------------------------------------------------------
  pdf-stage:
    deps: [gen, _guard-lang]
    # PRODUCT has no default. Without this, gen-entities gets an empty product.
    requires:
      vars: [PRODUCT]
    cmds:
      - task: stage-content
      - for: {var: LANGUAGES}
        # This runs after 'stage-content', so entities.adoc is the later of the
        # two paths. The STAGE=0 check in 'pdf' examines both.
        cmd: "{{.DOCBUILD}} gen-entities -product {{.PRODUCT}} -lang {{.ITEM}}"

  # --------------------------------------------------------------------------
  # PDF builds — one book
  # Usage: task pdf BOOK=administration PRODUCT=mlm LANGUAGES=en
  #
  # Like every other task, this iterates LANGUAGES and defaults to all of them.
  # LANG_CODE is the documentation code. LANG is the POSIX locale, set from
  # LOCALE for date formatting and asciidoctor-pdf.
  # --------------------------------------------------------------------------
  pdf:
    desc: "[Local] Build one PDF book — usage: task pdf BOOK=<book> PRODUCT=<product> LANGUAGES=<langs>"
    # 'setup', not 'gen'. build_pdfs.sh starts one 'task pdf' process for each
    # book, and 'run: once' applies to one process only, so each process
    # evaluates 'gen' again. 'gen-all' writes
    # translations/{lang}/branding/pdf/entities.adoc once for each product, to
    # a path with no product in it, in Go map order. A 'gen' after the staging
    # therefore replaces the staged entities with those of a different product.
    # 'pdf-stage' keeps the 'gen' dependency for the STAGE=1 path.
    deps: [setup, _guard-lang]
    vars:
      BOOK: '{{default "administration" .BOOK}}'
      PRODUCT: '{{default "mlm" .PRODUCT}}'
      # STAGE=0 tells this task that the caller stages the language.
      STAGE: '{{default "1" .STAGE}}'
    cmds:
      - for: {var: LANGUAGES}
        cmd: |
          BOOK="{{.BOOK}}"
          PRODUCT="{{.PRODUCT}}"
          LANG_CODE="{{.ITEM}}"

          # PDF theme for the product and language
          case "${PRODUCT}:${LANG_CODE}" in
            mlm:ja)    THEME=suse-jp ;;
            mlm:zh_CN) THEME=suse-sc ;;
            mlm:ko)    THEME=suse-ko ;;
            mlm:*)     THEME=suse ;;
            uyuni:ja)    THEME=uyuni-cjk ;;
            uyuni:zh_CN) THEME=uyuni-cjk ;;
            uyuni:ko)    THEME=uyuni-cjk ;;
            uyuni:*)     THEME=uyuni ;;
          esac

          # CJK attributes
          case "${LANG_CODE}" in
            ja|zh_CN|ko) CJK_ATTR="-a scripts=cjk" ;;
            *)            CJK_ATTR="" ;;
          esac

          # Locale for date formatting
          case "${LANG_CODE}" in
            ja)    LOCALE="ja_JP.UTF-8" ;;
            zh_CN) LOCALE="zh_CN.UTF-8" ;;
            ko)    LOCALE="ko_KR.UTF-8" ;;
            *)     LOCALE="en_US.utf8" ;;
          esac

          # Date format
          case "${LANG_CODE}" in
            ja|zh_CN) DATE_FMT="%Y年%m月%e日" ;;
            ko)       DATE_FMT="%Y년%m월%e일" ;;
            *)        DATE_FMT="%B %d %Y" ;;
          esac

          REVDATE=$(LANG=${LOCALE} LC_ALL=${LOCALE} date +"${DATE_FMT}")
          SRCDIR="translations/${LANG_CODE}"
          OUTDIR="build/${LANG_CODE}/pdf"
          mkdir -p "${OUTDIR}"

          # Resolve PDF filename prefix from config.yml (e.g. suse_multi_linux_manager or uyuni)
          PDF_PREFIX=$({{.DOCBUILD}} get-pdf-prefix -product ${PRODUCT})

          # Stage the content tree and entities.adoc, unless the caller stages
          # the full language. Asciidoctor reports only an ERROR for a missing
          # entities.adoc, and --failure-level FATAL ignores an ERROR. The
          # result is a PDF with unresolved attributes.
          #
          # Examine both paths that pdf-stage writes, not only the later one.
          # Also make sure that entities.adoc has content. An interrupted write
          # leaves an empty file, and an empty file resolves no attributes.
          case "{{.STAGE}}" in
            1)
              task pdf-stage PRODUCT=${PRODUCT} LANGUAGES=${LANG_CODE}
              ;;
            0)
              if [ ! -s "${SRCDIR}/branding/pdf/entities.adoc" ] || [ ! -d "${SRCDIR}/modules/${BOOK}" ]; then
                echo "STAGE=0 but ${LANG_CODE} is not staged:" >&2
                echo "  ${SRCDIR}/branding/pdf/entities.adoc is missing or empty," >&2
                echo "  or ${SRCDIR}/modules/${BOOK} is missing." >&2
                echo "run: task pdf-stage PRODUCT=${PRODUCT} LANGUAGES=${LANG_CODE}" >&2
                exit 1
              fi
              ;;
            *)
              echo "STAGE must be 0 or 1, got '{{.STAGE}}'." >&2
              exit 2
              ;;
          esac

          # Make the PDF nav file from the Antora nav. There is one file for
          # each book and language. Concurrent builds do not share it.
          {{.DOCBUILD}} gen-pdf-nav -book ${BOOK} -lang ${LANG_CODE} -dir ${SRCDIR}/modules/${BOOK}

          cd "${SRCDIR}"
          LANG=${LOCALE} LC_ALL=${LOCALE} asciidoctor-pdf \
            -r {{.XREF_EXT}} \
            -a lang=${LANG_CODE} \
            -a pdf-themesdir={{.PDF_THEMES_DIR}}/ \
            -a pdf-theme=${THEME} \
            -a pdf-fontsdir={{.PDF_FONTS_DIR}} \
            -a revdate="${REVDATE}" \
            -a examplesdir=modules/${BOOK}/examples \
            -a imagesdir=modules/${BOOK}/assets/images \
            ${CJK_ATTR} \
            --base-dir . \
            --out-file {{.ROOT_DIR}}/${OUTDIR}/${PDF_PREFIX}_${BOOK}_guide.pdf \
            modules/${BOOK}/nav-${BOOK}-guide.pdf.${LANG_CODE}.adoc \
            --failure-level FATAL \
            --trace

  # --------------------------------------------------------------------------
  # PDF builds — all books for a product
  # --------------------------------------------------------------------------
  # Books build concurrently. asciidoctor-pdf runs on one core, so concurrent
  # books are the only way to use more than one core in this step. JOBS=<n>
  # caps the count. The default is the core count.
  pdf:mlm:
    desc: "[Local] Build all MLM PDFs — all books, all languages (JOBS=<n> caps concurrency)"
    deps: [gen, _guard-lang]
    cmds:
      # Stage here, not in build_pdfs.sh. A task that the script starts runs in
      # a second process, where 'run: once' knows nothing about this one and
      # stage-content repeats its 'rm -rf'.
      - task: pdf-stage
        vars: {PRODUCT: mlm}
      - bash scripts/build_pdfs.sh mlm "{{.LANGUAGES}}" "{{.BOOKS}}"

  pdf:uyuni:
    desc: "[Local] Build all Uyuni PDFs — all books, all languages (JOBS=<n> caps concurrency)"
    deps: [gen, _guard-lang]
    cmds:
      - task: pdf-stage
        vars: {PRODUCT: uyuni}
      - bash scripts/build_pdfs.sh uyuni "{{.LANGUAGES}}" "{{.BOOKS}}"

  # The products run in sequence, not as parallel deps. Both write
  # translations/{lang}/branding/pdf/entities.adoc, which has no product in its
  # path. A parallel run puts one product's entities in the other product's
  # PDFs. One product usually uses all the cores, so the sequence costs little.
  pdf:all:
    desc: "[Local] Build all PDFs — both products, all languages"
    cmds:
      - task: pdf:mlm
      - task: pdf:uyuni

  # --------------------------------------------------------------------------
  # PDF collection — gather scattered build/{lang}/pdf/ into build/pdf/{lang}/
  # --------------------------------------------------------------------------
  pdf-collect:mlm:
    desc: "[Dev] Collect MLM PDFs from build/{lang}/pdf/ into build/pdf/{lang}/"
    deps: [setup, _guard-lang]
    cmds:
      - |
        PREFIX=$({{.DOCBUILD}} get-pdf-prefix -product mlm)
        {{.DOCBUILD}} collect-pdfs -product "${PREFIX}" -src {{.ROOT_DIR}}/build -dest {{.ROOT_DIR}}/build/pdf -langs '{{.LANGUAGES}}'

  pdf-collect:uyuni:
    desc: "[Dev] Collect Uyuni PDFs from build/{lang}/pdf/ into build/pdf/{lang}/"
    deps: [setup, _guard-lang]
    cmds:
      - |
        PREFIX=$({{.DOCBUILD}} get-pdf-prefix -product uyuni)
        {{.DOCBUILD}} collect-pdfs -product "${PREFIX}" -src {{.ROOT_DIR}}/build -dest {{.ROOT_DIR}}/build/pdf -langs '{{.LANGUAGES}}'

  # --------------------------------------------------------------------------
  # Publish — full HTML + PDF pipeline for documentation.suse.com (susecom-2025)
  # --------------------------------------------------------------------------
  publish:dsc:
    desc: "[Local] Full MLM publish — HTML (d.s.c branding) + PDFs + zip archives"
    deps: [setup, _guard-lang]
    cmds:
      - task: draft:mlm-dsc
      - task: pdf:mlm
      - task: pdf-collect:mlm
      - task: pdf-zip:mlm

  publish:uyuni:
    desc: "[Local] Full Uyuni publish — HTML (website branding) + PDFs + zip archives"
    deps: [setup, _guard-lang]
    cmds:
      - task: draft:uyuni-website
      - task: pdf:uyuni
      - task: pdf-collect:uyuni
      - task: pdf-zip:uyuni

  publish:webui-mlm:
    desc: "[Local] MLM WebUI publish — HTML (with language selector) + PDFs + zip archives"
    deps: [setup, _guard-lang]
    cmds:
      - task: draft:mlm-webui
      - task: pdf:mlm
      - task: pdf-collect:mlm
      - task: pdf-zip:mlm

  publish:webui-uyuni:
    desc: "[Local] Uyuni WebUI publish — HTML (with language selector) + PDFs + zip archives"
    deps: [setup, _guard-lang]
    cmds:
      - task: draft:uyuni-webui
      - task: pdf:uyuni
      - task: pdf-collect:uyuni
      - task: pdf-zip:uyuni

  # --------------------------------------------------------------------------
  # PDF zip archives — package collected PDFs for the index download link.
  # Zips land at build/{lang}/{product}_{lang}-pdf.zip so the index page link
  # "../{product}_{lang}-pdf.zip" resolves correctly from the HTML output dir.
  #
  # zip adds files to an archive that exists. Remove the old archive first, or
  # a book that a later run does not build stays in it, and a renamed book is
  # present with the old name and the new name. 'task clean' hides this. A
  # repeat build in place does not.
  # --------------------------------------------------------------------------
  pdf-zip:mlm:
    desc: "[Dev] Zip collected MLM PDFs into per-language archives"
    deps: [setup, _guard-lang]
    cmds:
      - for: {var: LANGUAGES}
        cmd: |
          LANG_CODE="{{.ITEM}}"
          ARCHIVE={{.ROOT_DIR}}/build/${LANG_CODE}/suse-multi-linux-manager-docs_${LANG_CODE}-pdf.zip
          mkdir -p build/${LANG_CODE}
          rm -f "${ARCHIVE}"
          cd build/pdf && zip -r9 "${ARCHIVE}" ${LANG_CODE}/

  pdf-zip:uyuni:
    desc: "[Dev] Zip collected Uyuni PDFs into per-language archives"
    deps: [setup, _guard-lang]
    cmds:
      - for: {var: LANGUAGES}
        cmd: |
          LANG_CODE="{{.ITEM}}"
          ARCHIVE={{.ROOT_DIR}}/build/${LANG_CODE}/uyuni-docs_${LANG_CODE}-pdf.zip
          mkdir -p build/${LANG_CODE}
          rm -f "${ARCHIVE}"
          cd build/pdf && zip -r9 "${ARCHIVE}" ${LANG_CODE}/

  # --------------------------------------------------------------------------
  # PDF archives — one zip of all PDFs for each product and language
  #
  # Task runs one interpreter for each multi-line 'cmd', so the 'cd' applies to
  # the rest of the block. Give zip an absolute destination, as 'pdf-zip:*'
  # does. A 'build/' path resolves one level too deep after the 'cd'.
  #
  # build/{lang}/pdf/ holds the books of the two products. Select the books
  # with the filename prefix of the product. Without the prefix, the two
  # archives get the same content and are different only in the name.
  # 'pdf-zip:*' prevents this in a different way: it reads build/pdf/{lang}/,
  # which 'pdf-collect:{product}' fills for one product at a time.
  #
  # zip adds files to an archive that exists. Remove the old archive first, or
  # a book that a later run does not build stays in it.
  # --------------------------------------------------------------------------
  pdf-tar:mlm:
    desc: "[Dev] Create OBS-style PDF zip archives for MLM"
    deps: [setup, _guard-lang]
    cmds:
      - for: {var: LANGUAGES}
        cmd: |
          LANG_CODE="{{.ITEM}}"
          PREFIX=$({{.DOCBUILD}} get-pdf-prefix -product mlm)
          ARCHIVE={{.ROOT_DIR}}/build/packages/suse-multi-linux-manager-docs_${LANG_CODE}-pdf.zip
          if ! ls build/${LANG_CODE}/pdf/${PREFIX}_*.pdf >/dev/null 2>&1 ; then
            echo "No ${PREFIX} PDFs in build/${LANG_CODE}/pdf. Run 'task pdf:mlm LANGUAGES=${LANG_CODE}' first." >&2
            exit 1
          fi
          mkdir -p build/packages
          rm -f "${ARCHIVE}"
          cd build && zip -r9 "${ARCHIVE}" ${LANG_CODE}/pdf/${PREFIX}_*.pdf

  pdf-tar:uyuni:
    desc: "[Dev] Create OBS-style PDF zip archives for Uyuni"
    deps: [setup, _guard-lang]
    cmds:
      - for: {var: LANGUAGES}
        cmd: |
          LANG_CODE="{{.ITEM}}"
          PREFIX=$({{.DOCBUILD}} get-pdf-prefix -product uyuni)
          ARCHIVE={{.ROOT_DIR}}/build/packages/uyuni-docs_${LANG_CODE}-pdf.zip
          if ! ls build/${LANG_CODE}/pdf/${PREFIX}_*.pdf >/dev/null 2>&1 ; then
            echo "No ${PREFIX} PDFs in build/${LANG_CODE}/pdf. Run 'task pdf:uyuni LANGUAGES=${LANG_CODE}' first." >&2
            exit 1
          fi
          mkdir -p build/packages
          rm -f "${ARCHIVE}"
          cd build && zip -r9 "${ARCHIVE}" ${LANG_CODE}/pdf/${PREFIX}_*.pdf

  # --------------------------------------------------------------------------
  # OBS packages — HTML tar.gz + PDF tar.gz → build/packages/
  # --------------------------------------------------------------------------
  obs:mlm:
    desc: "[Local] Generate OBS packages for MLM (HTML + PDF tarballs)"
    deps: [setup, _guard-lang]
    cmds:
      - task: draft:mlm-webui
      - task: pdf:mlm
      - for: {var: LANGUAGES}
        cmd: |
          LANG_CODE="{{.ITEM}}"
          # Rename PDFs to match legacy OBS filename convention:
          # mlm_{book}_guide.pdf → suse_multi_linux_manager_{book}_guide.pdf
          for f in build/${LANG_CODE}/pdf/mlm_*.pdf; do
            [ -f "$f" ] || continue
            mv "$f" "$(dirname "$f")/suse_multi_linux_manager_$(basename "$f" | sed 's/^mlm_//')"
          done
          mkdir -p build/packages
          tar --exclude="build/${LANG_CODE}/pdf" \
              -czvf build/packages/susemanager-docs_${LANG_CODE}.tar.gz \
              -C {{.ROOT_DIR}} build/${LANG_CODE}
          tar -czvf build/packages/susemanager-docs_${LANG_CODE}-pdf.tar.gz \
              -C {{.ROOT_DIR}} build/${LANG_CODE}/pdf

  obs:uyuni:
    desc: "[Local] Generate OBS packages for Uyuni (HTML + PDF tarballs)"
    deps: [setup, _guard-lang]
    cmds:
      - task: draft:uyuni-website
      - task: pdf:uyuni
      - for: {var: LANGUAGES}
        cmd: |
          LANG_CODE="{{.ITEM}}"
          mkdir -p build/packages
          tar --exclude="build/${LANG_CODE}/pdf" \
              -czvf build/packages/uyuni-docs_${LANG_CODE}.tar.gz \
              -C {{.ROOT_DIR}} build/${LANG_CODE}
          tar -czvf build/packages/uyuni-docs_${LANG_CODE}-pdf.tar.gz \
              -C {{.ROOT_DIR}} build/${LANG_CODE}/pdf

  # --------------------------------------------------------------------------
  # Validation
  # --------------------------------------------------------------------------
  validate:revdate:
    desc: "[Local] Check :revdate: on changed AsciiDoc pages (needs uv or python3)"
    cmds:
      - "{{.PYTHON_CMD}} scripts/check_revdate.py --grace-days 7 {{.CLI_ARGS}}"

  test:revdate:
    desc: "[Dev] Run the unit tests for scripts/check_revdate.py"
    cmds:
      - "{{.PYTHON_CMD}} scripts/test_check_revdate.py"

  validate:mlm:
    desc: "[Local] Antora xref validation — MLM"
    deps: [setup, _guard-lang]
    cmds:
      - task: stage-content
      - for: {var: LANGUAGES}
        cmd: |
          echo "==> Validating mlm-dsc / {{.ITEM}}"
          {{.DOCBUILD}} gen-site -product mlm -output mlm-dsc -lang {{.ITEM}}
          {{.DOCBUILD}} gen-antora -product mlm -lang {{.ITEM}}
          npx antora --log-failure-level=error --to-dir build/{{.ITEM}}/validate-mlm \
            translations/{{.ITEM}}/mlm-dsc.site.yml

  validate:uyuni:
    desc: "[Local] Antora xref validation — Uyuni"
    deps: [setup, _guard-lang]
    cmds:
      - task: stage-content
      - for: {var: LANGUAGES}
        cmd: |
          echo "==> Validating uyuni-website / {{.ITEM}}"
          {{.DOCBUILD}} gen-site -product uyuni -output uyuni-website -lang {{.ITEM}}
          {{.DOCBUILD}} gen-antora -product uyuni -lang {{.ITEM}}
          npx antora --log-failure-level=error --to-dir build/{{.ITEM}}/validate-uyuni \
            translations/{{.ITEM}}/uyuni-website.site.yml

  # --------------------------------------------------------------------------
  # Content staging — merge committed translations with English fallback
  # --------------------------------------------------------------------------
  stage-content:
    desc: "[Dev] Stage translated content for build (en base + lang overlay → translations/{lang}/modules/)"
    deps: [setup, _guard-lang]
    # Run one time for each invocation. 'publish:*' reaches this task through
    # both 'draft:*' and 'pdf:*', and a second run does
    # 'rm -rf translations/{lang}/modules' and deletes the tree that the first
    # run writes. This holds inside one process only. A task that a script
    # starts gets a second process with its own bookkeeping, therefore call
    # this task, or 'pdf-stage', with 'task:' and not from a command.
    run: once
    cmds:
      - for: {var: LANGUAGES}
        cmd: |
          LANG_CODE="{{.ITEM}}"
          CONTENT_DIR=$({{.DOCBUILD}} get-content-dir -lang "${LANG_CODE}")
          echo "==> Staging content for ${LANG_CODE} (source: ${CONTENT_DIR}/modules/)"
          rm -rf translations/${LANG_CODE}/modules
          mkdir -p translations/${LANG_CODE}/modules
          cp -a en/modules/. translations/${LANG_CODE}/modules/
          if [ -d "${CONTENT_DIR}/modules" ]; then
            cp -a "${CONTENT_DIR}/modules/." translations/${LANG_CODE}/modules/
          fi

  # --------------------------------------------------------------------------
  # Translations (deprecated — po4a/Weblate workflow)
  # --------------------------------------------------------------------------
  translations:
    desc: "[DEPRECATED] Use stage-content instead — po4a .po workflow is no longer used in builds"
    cmds:
      - |
        echo "WARNING: task translations is deprecated. Use 'task stage-content' instead."
        echo "See L10N-AI-MIGRATION.md for details."
      - task: stage-content

  pot:
    desc: "[DEPRECATED] po4a .pot/.po template update — no longer used in builds"
    cmds:
      - |
        echo "WARNING: task pot is deprecated. The build no longer uses po4a/Weblate."
        echo "See L10N-AI-MIGRATION.md for details."
        echo "The script scripts/make_pot.sh is retained for reference only."

  # --------------------------------------------------------------------------
  # Clean
  # --------------------------------------------------------------------------
  clean:
    desc: "[Dev] Remove build output, translation working dirs, and Antora cache"
    cmds:
      - rm -rf build/
      - rm -rf translations/
      - rm -rf .cache/
      - echo "Clean complete."

  # --------------------------------------------------------------------------
  # Container — build and run via Podman/Docker (no local toolchain required)
  # --------------------------------------------------------------------------
  container:build:
    desc: "[Dev] Build the uyuni-docs-builder container image locally"
    cmds:
      - "{{.CONTAINER_CMD}} build -t uyuni-docs-builder:latest -f Dockerfile.bci ."

  container:pull:
    desc: "[Container] Pull the latest pre-built uyuni-docs-builder image from ghcr.io"
    cmds:
      - "{{.CONTAINER_CMD}} pull {{.BUILDER_IMAGE}}"
      - "{{.CONTAINER_CMD}} tag {{.BUILDER_IMAGE}} uyuni-docs-builder:latest"
      - 'echo "uyuni-docs-builder:latest is now up to date."'

  container:check-update:
    desc: "[Container] Check whether a newer uyuni-docs-builder image is available on ghcr.io"
    silent: true
    cmds:
      - |
        if ! command -v skopeo >/dev/null 2>&1; then
          printf '\n  NOTE: skopeo is not installed — cannot check without pulling.\n'
          printf '  To update your local image run: task container:pull\n\n'
          exit 0
        fi
        REMOTE=$(skopeo inspect --no-creds docker://{{.BUILDER_IMAGE}} 2>/dev/null | grep -m1 '"Digest"' | awk -F'"' '{print $4}')
        LOCAL=$({{.CONTAINER_CMD}} image inspect uyuni-docs-builder:latest 2>/dev/null | grep -m1 '"Digest"' | awk -F'"' '{print $4}')
        if [ -z "$REMOTE" ]; then
          printf '\n  WARNING: Could not reach ghcr.io — skipping update check.\n\n'
        elif [ -z "$LOCAL" ]; then
          printf '\n  No local uyuni-docs-builder image found. Run: task container:pull\n\n'
        elif [ "$LOCAL" = "$REMOTE" ]; then
          printf '  uyuni-docs-builder is up to date.\n'
        else
          printf '\n'
          printf '  +--------------------------------------------------------------+\n'
          printf '  |  A new uyuni-docs-builder image is available on ghcr.io.     |\n'
          printf '  |  Run:  task container:pull                                   |\n'
          printf '  +--------------------------------------------------------------+\n'
          printf '\n'
        fi

  container:shell:
    desc: "[Dev] Open an interactive shell inside the uyuni-docs-builder container"
    cmds:
      - "{{.CONTAINER_CMD}} run --rm -it -v {{.ROOT_DIR}}:/docs:Z -w /docs {{.BUILDER_IMAGE}} bash"

  container:run:
    desc: "[Container] Run any task inside the container (escape hatch: task container:run -- <target>)"
    # This task carries the same two variables as the other container tasks.
    # The named tasks put LANGUAGES on the inner command line. This task cannot,
    # because the caller owns that line, thus LANGUAGES goes through the
    # environment. A 'LANGUAGES=' in CLI_ARGS has a higher precedence and wins.
    cmds:
      - "{{.CONTAINER_CMD}} run --rm -e JOBS='{{.JOBS}}' -e LANGUAGES='{{.LANGUAGES}}' -v {{.ROOT_DIR}}:/docs:Z -w /docs {{.BUILDER_IMAGE}} task {{.CLI_ARGS}}"

  # HTML builds
  container:draft:mlm-dsc:
    desc: "[Draft] MLM HTML — documentation.suse.com branding, via container (all languages; override with LANGUAGES=en)"
    deps: [_guard-lang]
    cmds:
      - "{{.CONTAINER_CMD}} run --rm -e JOBS='{{.JOBS}}' -v {{.ROOT_DIR}}:/docs:Z -w /docs {{.BUILDER_IMAGE}} task draft:mlm-dsc LANGUAGES='{{.LANGUAGES}}'"

  container:draft:mlm-webui:
    desc: "[Draft] MLM HTML — WebUI branding with language selector, via container (all languages; override with LANGUAGES=en)"
    deps: [_guard-lang]
    cmds:
      - "{{.CONTAINER_CMD}} run --rm -e JOBS='{{.JOBS}}' -v {{.ROOT_DIR}}:/docs:Z -w /docs {{.BUILDER_IMAGE}} task draft:mlm-webui LANGUAGES='{{.LANGUAGES}}'"

  container:draft:uyuni-website:
    desc: "[Draft] Uyuni HTML — website branding, via container (all languages; override with LANGUAGES=en)"
    deps: [_guard-lang]
    cmds:
      - "{{.CONTAINER_CMD}} run --rm -e JOBS='{{.JOBS}}' -v {{.ROOT_DIR}}:/docs:Z -w /docs {{.BUILDER_IMAGE}} task draft:uyuni-website LANGUAGES='{{.LANGUAGES}}'"

  container:draft:uyuni-webui:
    desc: "[Draft] Uyuni HTML — WebUI branding with language selector, via container (all languages; override with LANGUAGES=en)"
    deps: [_guard-lang]
    cmds:
      - "{{.CONTAINER_CMD}} run --rm -e JOBS='{{.JOBS}}' -v {{.ROOT_DIR}}:/docs:Z -w /docs {{.BUILDER_IMAGE}} task draft:uyuni-webui LANGUAGES='{{.LANGUAGES}}'"

  container:draft:all:
    desc: "[Draft] All four HTML output targets, via container (sequential; override with LANGUAGES=en)"
    deps: [_guard-lang]
    cmds:
      - "{{.CONTAINER_CMD}} run --rm -e JOBS='{{.JOBS}}' -v {{.ROOT_DIR}}:/docs:Z -w /docs {{.BUILDER_IMAGE}} task draft:all LANGUAGES='{{.LANGUAGES}}'"

  # PDF builds
  container:pdf:mlm:
    desc: "[Container] All MLM PDFs — all books, all languages (override with LANGUAGES=en)"
    deps: [_guard-lang]
    cmds:
      - "{{.CONTAINER_CMD}} run --rm -e JOBS='{{.JOBS}}' -v {{.ROOT_DIR}}:/docs:Z -w /docs {{.BUILDER_IMAGE}} task pdf:mlm LANGUAGES='{{.LANGUAGES}}'"

  container:pdf:uyuni:
    desc: "[Container] All Uyuni PDFs — all books, all languages (override with LANGUAGES=en)"
    deps: [_guard-lang]
    cmds:
      - "{{.CONTAINER_CMD}} run --rm -e JOBS='{{.JOBS}}' -v {{.ROOT_DIR}}:/docs:Z -w /docs {{.BUILDER_IMAGE}} task pdf:uyuni LANGUAGES='{{.LANGUAGES}}'"

  container:pdf:all:
    desc: "[Container] All PDFs — both products, all languages (override with LANGUAGES=en)"
    deps: [_guard-lang]
    cmds:
      - "{{.CONTAINER_CMD}} run --rm -e JOBS='{{.JOBS}}' -v {{.ROOT_DIR}}:/docs:Z -w /docs {{.BUILDER_IMAGE}} task pdf:all LANGUAGES='{{.LANGUAGES}}'"

  # Publish targets
  container:publish:dsc:
    desc: "[Container] Full MLM publish — HTML (d.s.c branding) + PDFs + zips (override with LANGUAGES=en)"
    deps: [_guard-lang]
    cmds:
      - "{{.CONTAINER_CMD}} run --rm -e JOBS='{{.JOBS}}' -v {{.ROOT_DIR}}:/docs:Z -w /docs {{.BUILDER_IMAGE}} task publish:dsc LANGUAGES='{{.LANGUAGES}}'"

  container:publish:uyuni:
    desc: "[Container] Full Uyuni publish — HTML (website branding) + PDFs + zips (override with LANGUAGES=en)"
    deps: [_guard-lang]
    cmds:
      - "{{.CONTAINER_CMD}} run --rm -e JOBS='{{.JOBS}}' -v {{.ROOT_DIR}}:/docs:Z -w /docs {{.BUILDER_IMAGE}} task publish:uyuni LANGUAGES='{{.LANGUAGES}}'"

  container:publish:webui-mlm:
    desc: "[Container] MLM WebUI publish — HTML (with language selector) + PDFs + zips (override with LANGUAGES=en)"
    deps: [_guard-lang]
    cmds:
      - "{{.CONTAINER_CMD}} run --rm -e JOBS='{{.JOBS}}' -v {{.ROOT_DIR}}:/docs:Z -w /docs {{.BUILDER_IMAGE}} task publish:webui-mlm LANGUAGES='{{.LANGUAGES}}'"

  container:publish:webui-uyuni:
    desc: "[Container] Uyuni WebUI publish — HTML (with language selector) + PDFs + zips (override with LANGUAGES=en)"
    deps: [_guard-lang]
    cmds:
      - "{{.CONTAINER_CMD}} run --rm -e JOBS='{{.JOBS}}' -v {{.ROOT_DIR}}:/docs:Z -w /docs {{.BUILDER_IMAGE}} task publish:webui-uyuni LANGUAGES='{{.LANGUAGES}}'"

  # OBS packages
  container:obs:mlm:
    desc: "[Container] OBS source packages for MLM"
    deps: [_guard-lang]
    cmds:
      - "{{.CONTAINER_CMD}} run --rm -e JOBS='{{.JOBS}}' -v {{.ROOT_DIR}}:/docs:Z -w /docs {{.BUILDER_IMAGE}} task obs:mlm LANGUAGES='{{.LANGUAGES}}'"

  container:obs:uyuni:
    desc: "[Container] OBS source packages for Uyuni"
    deps: [_guard-lang]
    cmds:
      - "{{.CONTAINER_CMD}} run --rm -e JOBS='{{.JOBS}}' -v {{.ROOT_DIR}}:/docs:Z -w /docs {{.BUILDER_IMAGE}} task obs:uyuni LANGUAGES='{{.LANGUAGES}}'"

  # Validation
  container:validate:mlm:
    desc: "[Container] Antora xref validation — MLM"
    deps: [_guard-lang]
    cmds:
      - "{{.CONTAINER_CMD}} run --rm -e JOBS='{{.JOBS}}' -v {{.ROOT_DIR}}:/docs:Z -w /docs {{.BUILDER_IMAGE}} task validate:mlm LANGUAGES='{{.LANGUAGES}}'"

  container:validate:uyuni:
    desc: "[Container] Antora xref validation — Uyuni"
    deps: [_guard-lang]
    cmds:
      - "{{.CONTAINER_CMD}} run --rm -e JOBS='{{.JOBS}}' -v {{.ROOT_DIR}}:/docs:Z -w /docs {{.BUILDER_IMAGE}} task validate:uyuni LANGUAGES='{{.LANGUAGES}}'"

  container:validate:revdate:
    desc: "[Container] Check :revdate: on changed AsciiDoc pages"
    # git refuses a repository of a different owner.
    cmds:
      - "{{.CONTAINER_CMD}} run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/docs -v {{.ROOT_DIR}}:/docs:Z -w /docs {{.PYTHON_IMAGE}} python3 scripts/check_revdate.py --grace-days 7 {{.CLI_ARGS}}"

  # Content staging
  container:stage-content:
    desc: "[Container] Stage translated content for build"
    deps: [_guard-lang]
    cmds:
      - "{{.CONTAINER_CMD}} run --rm -e JOBS='{{.JOBS}}' -v {{.ROOT_DIR}}:/docs:Z -w /docs {{.BUILDER_IMAGE}} task stage-content LANGUAGES='{{.LANGUAGES}}'"

  # Translations (deprecated)
  container:translations:
    desc: "[DEPRECATED] Use container:stage-content instead"
    deps: [_guard-lang]
    cmds:
      - "{{.CONTAINER_CMD}} run --rm -e JOBS='{{.JOBS}}' -v {{.ROOT_DIR}}:/docs:Z -w /docs {{.BUILDER_IMAGE}} task translations LANGUAGES='{{.LANGUAGES}}'"

  container:pot:
    desc: "[DEPRECATED] po4a template update — no longer used in builds"
    cmds:
      - "{{.CONTAINER_CMD}} run --rm -e JOBS='{{.JOBS}}' -v {{.ROOT_DIR}}:/docs:Z -w /docs {{.BUILDER_IMAGE}} task pot"

