# We keep this workflow without using uyuni-docs-helper as it interacts directly with the repository
name: Update translation files
on:
  push:
    branches:
    - 'master'
    - 'manager-4.3'
    - 'manager-4.3-MU-4.3.[0-9][0-9]?' # MU branches
    - 'manager-5.0'
    - 'manager-5.0-MU-5.0.[0-9][0-9]?'
    - 'manager-5.1'
    - 'manager-5.1-MU-5.1.[0-9][0-9]?'
    - 'manager-5.2'
    - 'manager-5.2-MU-5.2.[0-9][0-9]?'
  # A push is the only other trigger. Without this, a run that fails leaves the
  # gettext files stale until the next merge, and a rerun of the failed run
  # replays the old commit and cannot push.
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

    - name: 'Install po4a'
      run: |
        sudo apt-get update
        sudo apt-get install -y po4a

    - name: 'Update gettext files'
      run: |
        bash scripts/make_pot.sh

    - name: 'Commit changes, if any'
      uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 #v11.1.1
      with:
        author_name: Galaxy CI
        author_email: galaxy-ci@suse.de
        message: 'Automatic commit: update translation files'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
